name: ia
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/ia.yml"
permissions:
  contents: write
concurrency:
  group: bot
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy pandas scikit-learn
      - run: python ia_test.py
      - run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add ia_resultats.md
          git commit -m "ia" || exit 0
          git push
