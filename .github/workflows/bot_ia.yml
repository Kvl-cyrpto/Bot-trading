name: bot_ia
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/bot_ia.yml"
permissions:
  contents: write
concurrency:
  group: bot
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy pandas scikit-learn joblib
      - run: python bot_ia.py
      - run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add state_ia.json
          git commit -m "ia" || exit 0
          git push
