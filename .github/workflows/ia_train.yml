name: ia_train
on:
  schedule:
    - cron: "30 3 1 * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/ia_train.yml"
permissions:
  contents: write
concurrency:
  group: bot
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy pandas scikit-learn joblib
      - run: python ia_train.py
      - run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add modele_ia.joblib modele_ia_info.json
          git commit -m "modele" || exit 0
          git push
