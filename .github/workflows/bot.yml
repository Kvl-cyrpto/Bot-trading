name: bot
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bot
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python bot.py
        continue-on-error: true
      - run: python bot_melange.py
        continue-on-error: true
      - run: python bot_ict.py
        continue-on-error: true
      - run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add state*.json
          git commit -m "maj" || exit 0
          git push
